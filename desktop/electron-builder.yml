appId: build.conductive.desktop
productName: Conductive
artifactName: Conductive-${version}-mac-${arch}.${ext}
directories:
  output: dist/release
files:
  - dist/app/**
  - dist/bundle/**
  - package.json
asar: true
protocols:
  - name: Conductive sign-in
    schemes: [conductive]
mac:
  # The release command overrides these three fields and requires credentials.
  icon: dist/bundle/conductive.icns
  category: public.app-category.developer-tools
  identity: '-'
  hardenedRuntime: false
  notarize: false
  # The package commands choose the architectures with --arm64 and --x64.
  # An arch list here would override those flags.
  target: [dmg, zip]
dmg:
  writeUpdateInfo: false
publish:
  # Keep owner and repo equal to sourceRepository in src/shared/brand.ts.
  provider: github
  owner: Firna-AI
  repo: conductive
  releaseType: release
  tagNamePrefix: v
