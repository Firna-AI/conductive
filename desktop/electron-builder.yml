appId: build.conducting.desktop
productName: Conducting
artifactName: Conducting-${version}-mac-${arch}.${ext}
directories:
  output: dist/release
files:
  - dist/app/**
  - dist/bundle/**
  - package.json
asar: true
protocols:
  - name: Conducting sign-in
    schemes: [conducting]
mac:
  icon: dist/bundle/conducting.icns
  category: public.app-category.developer-tools
  identity: '-'
  hardenedRuntime: false
  notarize: false
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
publish:
  provider: github
  owner: Firna-AI
  repo: conducting-desktop
  releaseType: prerelease
  tagNamePrefix: v
