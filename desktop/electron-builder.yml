appId: build.conductive.desktop
productName: Conductive
artifactName: Conductive-${version}-mac-${arch}.${ext}
directories:
  output: dist/release
files:
  - dist/app/**
  - dist/bundle/**
  - package.json
asar: true
protocols:
  - name: Conductive sign-in
    schemes: [conductive]
mac:
  icon: dist/bundle/conductive.icns
  category: public.app-category.developer-tools
  identity: '-'
  hardenedRuntime: false
  notarize: false
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
publish:
  provider: github
  owner: Firna-AI
  repo: conductive-desktop
  releaseType: prerelease
  tagNamePrefix: v
