appId: build.conductive.desktop
productName: Conductive
artifactName: Conductive-${version}-mac-${arch}.${ext}
directories:
  output: dist/release
files:
  - dist/app/**
  - dist/bundle/**
  - package.json
asar: true
protocols:
  - name: Conductive sign-in
    schemes: [conductive]
mac:
  # The release command overrides these three fields and requires credentials.
  icon: dist/bundle/conductive.icns
  category: public.app-category.developer-tools
  identity: '-'
  hardenedRuntime: false
  notarize: false
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
dmg:
  writeUpdateInfo: false
publish:
  # Keep owner and repo equal to sourceRepository in docs/mockups/src/brand.ts.
  provider: github
  owner: Firna-AI
  repo: conductive
  releaseType: release
  tagNamePrefix: v
