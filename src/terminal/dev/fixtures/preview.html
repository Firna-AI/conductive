<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout · Acme</title>
    <style>
      body {
        margin: 0;
        background: #ffffff;
        color: #111827;
        font-family:
          Inter,
          -apple-system,
          'Segoe UI',
          sans-serif;
        font-size: 14px;
      }
      nav {
        display: flex;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid #e5e7eb;
      }
      .logo {
        font-weight: 800;
        letter-spacing: 0.12em;
      }
      .cart {
        color: #4b5563;
        font-size: 12px;
      }
      main {
        padding: 16px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 20px;
      }
      label {
        display: block;
        margin: 10px 0 4px;
        font-size: 12px;
        font-weight: 600;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font: inherit;
      }
      button {
        width: 100%;
        margin-top: 16px;
        padding: 9px;
        border: 0;
        border-radius: 6px;
        background: #4f46e5;
        color: #ffffff;
        font: inherit;
        font-weight: 600;
      }
      .port {
        margin-top: 16px;
        color: #6b7280;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <nav><span class="logo">ACME</span><span class="cart">Cart (2)</span></nav>
    <main>
      <h1>Checkout</h1>
      <label for="address">Address</label>
      <input id="address" value="221B Baker St" />
      <label for="city">City</label>
      <input id="city" placeholder="City" />
      <button type="button">Continue to payment</button>
      <p class="port" id="port">Development fixture</p>
      <p class="port" id="referrer"></p>
    </main>
    <script>
      const port = new URLSearchParams(location.search).get('port')
      if (port) document.getElementById('port').textContent = `Port ${port}`
      document.getElementById('referrer').textContent =
        `Referrer: ${document.referrer || 'none'}`
    </script>
  </body>
</html>
