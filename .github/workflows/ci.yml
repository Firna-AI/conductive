name: CI

# CI runs on pull requests, and on pushes to main and the primary branch.
on:
  push:
    branches: [main, calummoore/conductor-alternative-architecture]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Complete gate
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm --prefix desktop ci
          npm ci --prefix runner

      - name: Run complete gate
        run: npm run check
