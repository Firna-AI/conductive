name: Desktop

# Pull requests and pushes run Apple silicon and Intel checks.
# release.yml handles signing and releases.
on:
  workflow_dispatch:
  push:
    branches: [main, calummoore/conductor-alternative-architecture]
    paths:
      - 'desktop/**'
      - 'worker/security/desktop-*'
      - 'src/**'
      - '.github/workflows/desktop-ci.yml'
      - '.github/workflows/desktop-mac-checks.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'worker/security/desktop-*'
      - 'src/**'
      - '.github/workflows/desktop-ci.yml'
      - '.github/workflows/desktop-mac-checks.yml'

permissions:
  contents: read

jobs:
  mac:
    uses: ./.github/workflows/desktop-mac-checks.yml
