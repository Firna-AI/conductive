name: Mac app checks

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      # A JSON list of the architectures to check, from arm64 and x64.
      architectures:
        type: string
        default: '["arm64", "x64"]'

permissions:
  contents: read

jobs:
  mac:
    name: Mac app ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architectures) }}
    # Blacksmith runs Apple silicon Macs only, so the Intel job stays on a
    # GitHub-hosted runner.
    runs-on: ${{ matrix.arch == 'arm64' && 'blacksmith-6vcpu-macos-15' || 'macos-15-intel' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop run typecheck
      - run: npm --prefix desktop run lint
      - run: npm --prefix desktop run format:check
      - run: npm --prefix desktop run test:logic
      - run: npm --prefix desktop run build
        env:
          CONDUCTIVE_FRAME_SOURCES: https://*.conductive.page https://*.on.boat.dev
      - run: npm --prefix desktop run test:electron
      - run: npm --prefix desktop run package
      - run: npm --prefix desktop run test:packaged
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: desktop-evidence-${{ matrix.arch }}
          path: |
            .context/boat-native-remote-workspaces/desktop-*.json
            .context/boat-native-remote-workspaces/desktop-*.png
            desktop/dist/test-results/
          retention-days: 14
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-packages-${{ matrix.arch }}
          path: |
            desktop/dist/release/*.dmg
            desktop/dist/release/*.zip
          retention-days: 14
