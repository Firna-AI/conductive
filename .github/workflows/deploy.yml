name: Deploy

# Deploy each push to main, or a manual run from main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push never cancels a running deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # An older commit deploys nothing and starts a new run on main.
  # GitHub does not keep runs in push order.
  check:
    name: Check the commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stale: ${{ steps.commit.outputs.stale }}
    steps:
      - name: Check the head of main
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha) &&
            [[ "$head" =~ ^[[:xdigit:]]{40}$ ]]; then
            if [[ "$head" != "$GITHUB_SHA" ]]; then
              echo '::notice::This run starts a new deploy of the head of main.'
              echo 'stale=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo '::warning::Could not read a valid head of main. This run deploys its own commit.'
          fi
          echo 'stale=false' >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: needs.check.outputs.stale == 'false'
    environment:
      name: production
      url: https://app.conductive.build
    env:
      RUNNER_BASE_URL: https://runner.conductive.build/
      RUNNER_BUCKET: conductive-runner
      HEALTH_URL: https://app.conductive.build/api/health
    steps:
      # Check settings before a build or a change to the deployment.
      - name: Decide whether to deploy
        id: decide
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" && "$TOKEN_SET" != true ]]; then
            echo '::warning::Deployment skipped: environment production needs secret CLOUDFLARE_API_TOKEN and variable CLOUDFLARE_ACCOUNT_ID. See docs/automatic-deploys.md#github-settings.'
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Environment production is missing variable CLOUDFLARE_ACCOUNT_ID.'
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [[ "$TOKEN_SET" != true ]]; then
            echo '::error::Environment production is missing secret CLOUDFLARE_API_TOKEN.'
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo 'deploy=true' >> "$GITHUB_OUTPUT"

      - name: Check out repository
        if: steps.decide.outputs.deploy == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The deploy job skips the npm cache.
      - name: Set up Node
        if: steps.decide.outputs.deploy == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix runner

      # Build before any change to the live deployment.
      - name: Build app
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          npm run build

      # Name the archive by the digest of its contents.
      - name: Package runner
        id: runner
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          node image/package-runner.mjs --base-url "$RUNNER_BASE_URL"
          metadata=.context/runner-artifact/runner.tar.gz.json
          url=$(jq -r '.url' "$metadata")
          sha256=$(jq -r '.sha256' "$metadata")
          if [[ ! "$sha256" =~ ^[[:xdigit:]]{64}$ ||
            "$url" != "${RUNNER_BASE_URL}runner-${sha256}.tar.gz" ]]; then
            echo '::error::Runner archive metadata has an invalid digest or URL.'
            exit 1
          fi
          {
            echo "url=$url"
            echo "sha256=$sha256"
            echo "key=runner-${sha256}.tar.gz"
          } >> "$GITHUB_OUTPUT"

      # Keep the derived S3 credentials in this step only.
      - name: Publish runner
        id: publish
        if: steps.decide.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ARCHIVE_URL: ${{ steps.runner.outputs.url }}
          ARCHIVE_KEY: ${{ steps.runner.outputs.key }}
        run: |
          set -euo pipefail
          token_id=$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" |
            jq -r '.result.id // empty') || token_id=''
          if [[ -z "$token_id" ]]; then
            token_id=$(curl -fsS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              'https://api.cloudflare.com/client/v4/user/tokens/verify' |
              jq -r '.result.id // empty') || token_id=''
          fi
          if [[ -z "$token_id" ]]; then
            echo '::error::Could not read the Cloudflare token ID for the runner upload.'
            exit 1
          fi
          echo "::add-mask::$token_id"
          secret_key=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum)
          secret_key=${secret_key%% *}
          echo "::add-mask::$secret_key"
          export AWS_ACCESS_KEY_ID="$token_id" AWS_SECRET_ACCESS_KEY="$secret_key"
          endpoint="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          archive=.context/runner-artifact/runner.tar.gz
          if aws s3api head-object --bucket "$RUNNER_BUCKET" --key "$ARCHIVE_KEY" \
            --endpoint-url "$endpoint" > /dev/null 2>&1; then
            echo 'Runner archive already exists.'
            result=reused
          else
            aws s3 cp "$archive" "s3://$RUNNER_BUCKET/$ARCHIVE_KEY" \
              --endpoint-url "$endpoint" --content-type application/gzip --only-show-errors
            result=uploaded
          fi
          if ! headers=$(curl -fsSI --retry 3 "$ARCHIVE_URL"); then
            echo "::error::Could not read the public runner archive at $ARCHIVE_URL."
            exit 1
          fi
          remote_size=$(printf '%s\n' "$headers" |
            awk 'tolower($1) == "content-length:" {gsub("\r", "", $2); size=$2} END {print size}')
          local_size=$(stat -c %s "$archive")
          if [[ "$remote_size" != "$local_size" ]]; then
            echo "::error::Public runner archive size does not match the local archive at $ARCHIVE_URL."
            exit 1
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

      # Use the source config so migrations do not follow the build redirect.
      - name: Apply migrations
        if: steps.decide.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc

      # Wrangler follows the build redirect to the built Worker.
      - name: Deploy Worker
        if: steps.decide.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ARCHIVE_URL: ${{ steps.runner.outputs.url }}
          ARCHIVE_SHA256: ${{ steps.runner.outputs.sha256 }}
        run: |
          set -euo pipefail
          npx wrangler deploy \
            --var "CONDUCTIVE_RUNNER_ARCHIVE_URL:$ARCHIVE_URL" \
            --var "CONDUCTIVE_RUNNER_ARCHIVE_SHA256:$ARCHIVE_SHA256" \
            --tag "${GITHUB_SHA:0:7}" --message "main at $GITHUB_SHA"

      - name: Check health
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if body=$(curl -fsS --max-time 10 "$HEALTH_URL") &&
              jq -e '.status == "ok"' <<< "$body" > /dev/null; then
              exit 0
            fi
            if [[ "$attempt" -lt 12 ]]; then
              sleep 5
            fi
          done
          echo "::error::Health check failed for $HEALTH_URL."
          exit 1

      - name: Write deploy summary
        if: steps.decide.outputs.deploy == 'true'
        env:
          ARCHIVE_URL: ${{ steps.runner.outputs.url }}
          PUBLISH_RESULT: ${{ steps.publish.outputs.result }}
        run: |
          set -euo pipefail
          {
            printf 'Commit: %s\n\n' "$GITHUB_SHA"
            printf 'Runner archive: %s\n\n' "$ARCHIVE_URL"
            printf 'Archive publish result: %s\n' "$PUBLISH_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"

  redeploy:
    name: Start a deploy of the head
    needs: check
    if: needs.check.outputs.stale == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start a deploy of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/dispatches" \
            -f ref=main > /dev/null; then
            echo '::error::Could not start a new deploy of the head of main.'
            exit 1
          fi
