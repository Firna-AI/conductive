name: Sign Mac app

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      updates:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sign:
    name: Signed and notarized Mac packages
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 90
    environment: desktop-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop run build
        env:
          CONDUCTIVE_DESKTOP_UPDATES: ${{ inputs.updates && 'enabled' || 'unpublished' }}
      - name: Sign and notarize both Mac architectures
        run: npm --prefix desktop run package:release
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CONDUCTIVE_APPLE_TEAM_ID: ${{ vars.CONDUCTIVE_APPLE_TEAM_ID }}
      - run: npm --prefix desktop run test:packaged
      - name: Remove temporary signing credentials
        if: always()
        shell: bash
        run: |
          for folder in "$RUNNER_TEMP"/conductive-release-*; do
            [ -d "$folder" ] || continue
            security delete-keychain "$folder/signing.keychain-db" 2>/dev/null || true
            rm -rf "$folder"
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: desktop-release-evidence
          path: |
            .context/boat-native-remote-workspaces/desktop-*.json
            desktop/dist/test-results/
          retention-days: 14
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-signed-packages
          if-no-files-found: error
          path: |
            desktop/dist/release/*.dmg
            desktop/dist/release/*.zip
            desktop/dist/release/*.zip.blockmap
            desktop/dist/release/latest-mac.yml
          retention-days: 14
